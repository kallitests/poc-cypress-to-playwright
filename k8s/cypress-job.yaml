# Run-to-completion Cypress suite. CI renders this template with
#   envsubst '${IMAGE_TAG}' < k8s/cypress-job.yaml | kubectl apply -f -
# then waits on the Job's Complete/Failed condition (ci/wait-for-job.sh).
# A Job (not a Deployment) is the right primitive: the pod must terminate and its exit code IS the result.
# For scheduled runs in a real cluster, wrap the same pod template in a CronJob.
apiVersion: batch/v1
kind: Job
metadata:
  name: cypress-migration-poc
  labels: { app.kubernetes.io/part-of: migration-poc, suite: cypress }
spec:
  # A failing test is a result, not an infrastructure error: never re-run the whole suite.
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: migration-poc, suite: cypress }
    spec:
      restartPolicy: Never
      containers:
        - name: cypress
          image: migration-poc/cypress:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CI, value: "true" }
          envFrom:
            - configMapRef: { name: migration-poc-env }
            - secretRef: { name: migration-poc-secrets, optional: true }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "3Gi" }
          volumeMounts:
            - { name: results, mountPath: /app/results }
      volumes:
        # POC only: on kind, /results is bind-mounted from the CI runner (ci/kind-config.yaml),
        # so reports land on the runner and can be uploaded as artifacts.
        # In a real cluster, push reports to object storage (S3/Blob) instead of using hostPath.
        - name: results
          hostPath: { path: /results/cypress, type: DirectoryOrCreate }
