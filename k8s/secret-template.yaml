# Placeholder template only — never commit real values.
# Least privilege: the test pods only receive the credentials the scenarios need.
# Alerting / reporting secrets (Slack, Discord, Gmail, Power BI, Anthropic) stay in GitHub Actions secrets
# and are only exposed to the CI steps that use them, never to the browser containers.
# CI creates the real Secret with `kubectl create secret generic migration-poc-secrets --from-literal=...`.
apiVersion: v1
kind: Secret
metadata:
  name: migration-poc-secrets
type: Opaque
stringData:
  TEST_USER_EMAIL: "replace-at-deploy-time"
  TEST_USER_PASSWORD: "replace-at-deploy-time"
