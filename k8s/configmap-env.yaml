# Non-secret runtime configuration shared by both Jobs. CI applies it before the run and may override
# BASE_URL / PW_REPEAT_EACH (workflow_dispatch input, nightly flake hunting) with `kubectl create configmap --dry-run | kubectl apply`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-poc-env
data:
  BASE_URL: "https://automationexercise.com"
  TEST_ENV: "public"
  PW_REPEAT_EACH: "1"
