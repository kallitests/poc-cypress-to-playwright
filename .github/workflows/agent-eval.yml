# AI agent test harness (agents/test-agent): the test pyramid applied to a non-deterministic system.
#   unit        -> every PR touching agents/**: mocked LLM, free, deterministic
#   integration -> main + manual: real LLM calls, property-based assertions (costs tokens)
#   eval        -> nightly + manual: LLM-as-judge with a pass-rate threshold (costs 2x tokens)
# Tests that need a key are SKIPPED (not failed) when the secret is absent — see tests/conftest.py.
name: agent-eval-harness

on:
  pull_request:
    paths: ['agents/**', '.github/workflows/agent-eval.yml']
  push:
    branches: [main]
    paths: ['agents/**', '.github/workflows/agent-eval.yml']
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: agents/test-agent

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/test-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m "not integration and not eval" --junitxml=junit-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-junit-unit
          path: agents/test-agent/junit-unit.xml

  integration-tests:
    needs: unit-tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/test-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m integration --junitxml=junit-integration.xml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-junit-integration
          path: agents/test-agent/junit-integration.xml

  eval-tests:
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/test-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m eval --junitxml=junit-eval.xml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-junit-eval
          path: agents/test-agent/junit-eval.xml
